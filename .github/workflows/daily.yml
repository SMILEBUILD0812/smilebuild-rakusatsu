name: 落札情報 毎日更新＋通知

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC = 翌 07:30 JST（毎日）
  workflow_dispatch:
    inputs:
      sample:
        description: "動作確認用にダミーデータで実行（チェック=サンプル）"
        type: boolean
        default: false

permissions:
  contents: write            # history.json / data.json をリポジトリに書き戻すため

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: Playwright（PPI使用時のみ）
        if: ${{ vars.USE_PPI == '1' }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: パイプライン実行
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          NOTIFY_MIN_YEN: ${{ secrets.NOTIFY_MIN_YEN }}
          NOTIFY_MAX_YEN: ${{ secrets.NOTIFY_MAX_YEN }}
          NOTIFY_PREFS:   ${{ secrets.NOTIFY_PREFS }}
          GBIZ_TOKEN:     ${{ secrets.GBIZ_TOKEN }}
          USE_PPI:        ${{ vars.USE_PPI }}
          BUREAUS_ONLY:   ${{ vars.BUREAUS_ONLY }}
          LOOKBACK_DAYS:  ${{ vars.LOOKBACK_DAYS }}
        run: python pipeline.py ${{ github.event.inputs.sample == 'true' && '--sample' || '' }}

      - name: 蓄積データをコミット
        run: |
          git config user.name  "smilebuild-bot"
          git config user.email "bot@smile-build.com"
          git add -A
          # 変更が無ければ何もせず終了
          if git diff --cached --quiet; then
            echo "変更なし、コミット・push スキップ"
            exit 0
          fi
          git commit -m "data update $(date +%F)"
          # 競合に強い rebase + リトライ付き push（最大3回）
          # 走行中にmainが進んでた場合でも、fetch→rebase→push でやり直す
          n=0
          until [ $n -ge 3 ]; do
            git fetch origin main
            git rebase origin/main || { echo "rebase失敗、abort して再試行"; git rebase --abort; }
            if git push origin HEAD:main; then
              echo "push成功"
              exit 0
            fi
            n=$((n+1))
            echo "push再試行 $n / 3"
            sleep 5
          done
          echo "push最終失敗"
          exit 1
